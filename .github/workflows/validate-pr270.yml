name: TextureCraft release package validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-validation:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@45f840aee1c2992065480ecdb546b051c555c73f
    with:
      craft-fonts-ref: aced4137c022f1f587624d48e81ec77e1914a9cc
      os: '["ubuntu-24.04"]'
      tools: ""
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev
      command: cargo test --locked -p texturecraft-formats --release
      timeout-minutes: 25
      gate-timeout-minutes: 22

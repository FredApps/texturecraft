name: TextureCraft OBJ error release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-validation:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@45f840aee1c2992065480ecdb546b051c555c73f
    with:
      craft-fonts-ref: aced4137c022f1f587624d48e81ec77e1914a9cc
      os: '["ubuntu-24.04"]'
      tools: ""
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev
      timeout-minutes: 90
      gate-timeout-minutes: 85
      command: |
        set -euo pipefail
        git fetch origin af39837cb871ba9806e3bb37b55c5afbcbbfd18d
        test "$(git rev-parse af39837cb871ba9806e3bb37b55c5afbcbbfd18d^{tree})" = 646c56f35d9fd272988bf2c226c1f6c30ff66fff
        git diff --exit-code af39837cb871ba9806e3bb37b55c5afbcbbfd18d HEAD -- . ':!.github/workflows/validate-pr270.yml'
        cargo fmt --all --check
        cargo test --locked --release -p texturecraft-formats -p texturecraft-engine -p texturecraft-ui-egui
        trap 'git checkout HEAD -- crates/formats/src/mesh_export.rs' EXIT
        python3 - <<'PY'
        from pathlib import Path
        p = Path("crates/formats/src/mesh_export.rs")
        s = p.read_text()
        a = '.map(String::into_bytes).map_err(|e| FormatError::Invalid(e.to_string()))'
        b = '.map_err(|e| FormatError::Invalid(e.to_string()))?;'
        assert s.count(a) == 1
        assert s.count(b) == 1
        s = s.replace(a, '.map(String::into_bytes).or_else(|_| Ok(Vec::new()))', 1)
        s = s.replace(b, '.unwrap_or_default();', 1)
        p.write_text(s)
        PY
        set +e
        cargo test --locked --release -p texturecraft-formats obj_writers_report_invalid_corner_indices -- --nocapture > /tmp/obj-formats-old.log 2>&1
        format_status=$?
        cargo test --locked --release -p texturecraft-engine rejected_obj_export_preserves_existing_files_and_publishes_nothing -- --nocapture > /tmp/obj-engine-old.log 2>&1
        engine_status=$?
        set -e
        cat /tmp/obj-formats-old.log /tmp/obj-engine-old.log
        git checkout HEAD -- crates/formats/src/mesh_export.rs
        trap - EXIT
        test "$format_status" -ne 0
        test "$engine_status" -ne 0
        grep -F 'obj_writers_report_invalid_corner_indices ... FAILED' /tmp/obj-formats-old.log
        grep -F 'rejected_obj_export_preserves_existing_files_and_publishes_nothing ... FAILED' /tmp/obj-engine-old.log
        cargo test --locked --release -p texturecraft-formats obj_writers_report_invalid_corner_indices
        cargo test --locked --release -p texturecraft-engine rejected_obj_export_preserves_existing_files_and_publishes_nothing
        git diff --exit-code HEAD -- Cargo.lock crates/
